name: Fix deps
on:
  push:
    branches: [fixdeps]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          npx expo install --check
          git config user.name deckkk491-creator
          git config user.email deckkk491@gmail.com
          git rm -q --cached .github/workflows/fixdeps.yml
          rm .github/workflows/fixdeps.yml
          git add package.json package-lock.json
          git commit -m "Expo: патч-версии expo, expo-font, expo-router под SDK 58" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push origin HEAD:fixdeps-result
